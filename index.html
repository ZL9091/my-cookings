<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2420">
<title>My Cookings</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2420; --page:#F2F4EF; --surface:#FFFFFF; --line:#D6DBD2; --muted:#5F675E;
  --meat:#7A2630; --vegan:#3E6B3A; --accent:var(--ink); --on-accent:#fff;
  --serif:'Young Serif',Georgia,'Times New Roman',serif;
  --sans:Figtree,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{ --ink:#E6EAE3; --page:#151916; --surface:#1E2420; --line:#333B35; --muted:#A3ACA0;
    --meat:#B04A55; --vegan:#6E9F68; }
}
.theme-meat{--accent:var(--meat)} .theme-vegan{--accent:var(--vegan)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 17px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 40px}

/* Home: the two doors */
.home{display:grid;grid-template-rows:auto 1fr 1fr auto;min-height:100%;min-height:100dvh}
.home-head{padding:calc(env(safe-area-inset-top) + 18px) 24px 14px;display:flex;align-items:baseline;justify-content:space-between}
.home-head h1{margin:0;font:400 1.25rem/1 var(--serif)}
.door{display:flex;flex-direction:column;justify-content:flex-end;padding:24px 24px 22px;color:#fff;text-decoration:none;position:relative;overflow:hidden;isolation:isolate}
.door-meat{background:radial-gradient(120% 90% at 85% 30%,#93323D 0%,#7A2630 55%,#651E28 100%)}
.door-vegan{background:radial-gradient(120% 90% at 85% 30%,#4C7F47 0%,#3E6B3A 55%,#33592F 100%)}
.door h2{margin:0;font:400 clamp(3.4rem,19vw,6rem)/.9 var(--serif);letter-spacing:-.01em;position:relative;z-index:1;text-shadow:0 2px 12px rgba(0,0,0,.18)}
.door span{margin-top:8px;font-weight:500;opacity:.9;position:relative;z-index:1}
.door .art{position:absolute;z-index:0;right:-3%;top:5%;transform:rotate(var(--tilt,0deg));
  height:min(74%,320px);width:auto;max-width:62%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28));transition:transform .25s ease}
.door-meat .art{--tilt:-6deg} .door-vegan .art{--tilt:5deg}
.door:active .art{transform:rotate(var(--tilt)) scale(.95)}
.door:active{filter:brightness(.94)}
@media (prefers-reduced-motion:reduce){.door .art{transition:none}}
.home-foot{display:block;padding:16px 24px calc(env(safe-area-inset-bottom) + 18px);text-decoration:none;color:var(--muted);font-size:.95rem}
.home-foot.warn{color:var(--ink);font-weight:500}
.home-foot.warn::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#C8902E;margin-right:8px;vertical-align:middle}

/* Top bar */
.top{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--accent);color:var(--on-accent)}
.top h1{margin:0;font:400 1.35rem/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;text-decoration:none}
.back:active{background:rgba(255,255,255,.15)}
.top-r a,.top-r button{display:inline-block;padding:9px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.7);
  background:none;color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;cursor:pointer}

/* List */
.search{width:100%;margin:18px 0 6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.list{list-style:none;margin:0;padding:0}
.list a{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);font:400 1.5rem var(--serif)}
.list b{display:block;font-weight:600}
.list small{color:var(--muted)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.empty p{margin:0 0 18px}

/* Recipe */
.hero{display:block;width:100%;max-height:52vh;object-fit:cover}
.r-title{font:400 clamp(2rem,8vw,2.6rem)/1.1 var(--serif);margin:22px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);margin:0 0 8px}
.sample{margin:14px 0 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface);color:var(--muted);font-size:.93rem}
.recipe h2{font:400 1.3rem var(--serif);margin:28px 0 10px;color:var(--accent)}
.ing{list-style:none;margin:0;padding:0}
.ing li{padding:10px 0 10px 34px;border-bottom:1px solid var(--line);position:relative;cursor:pointer;user-select:none}
.ing li::before{content:"";position:absolute;left:2px;top:13px;width:18px;height:18px;border:2px solid var(--line);border-radius:5px}
.ing li.done{color:var(--muted);text-decoration:line-through}
.ing li.done::before{background:var(--accent);border-color:var(--accent)}
.hint{color:var(--muted);font-size:.88rem;margin:6px 0 0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;padding:10px 0 10px 40px;position:relative;line-height:1.6}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;
  background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:600}
.notes{white-space:pre-wrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;
  font-weight:600;text-decoration:none;cursor:pointer;border:1.5px solid var(--accent);background:none;color:var(--accent)}
.btn-primary{background:var(--accent);color:#fff}
.btn-danger{border-color:#B3261E;color:#B3261E;margin-top:36px;width:100%}
.btn input[type=file]{display:none}

/* Form */
.form{padding-top:18px}
.field{display:block;margin:0 0 18px}
.field>span{display:block;font-weight:600;margin-bottom:4px}
.field small{display:block;color:var(--muted);margin:-2px 0 6px;font-size:.88rem}
.field input,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.field textarea{resize:vertical;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{border:0;padding:0;margin:0 0 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg legend{font-weight:600;margin-bottom:6px;padding:0}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;cursor:pointer}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.photo-box img{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:10px}
.photo-actions{display:flex;flex-wrap:wrap;gap:10px}
.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:8px;position:sticky;bottom:0;
  padding:12px 0 calc(env(safe-area-inset-bottom) + 12px);background:var(--page)}

/* Backup */
.backup section{padding:22px 0;border-bottom:1px solid var(--line)}
.backup section:last-child{border-bottom:0}
.backup h2{font:400 1.35rem var(--serif);margin:0 0 6px}
.backup p{margin:0 0 14px;color:var(--muted)}
.backup .status{color:var(--ink);font-weight:500}
.backup ol{margin:0 0 12px;padding-left:22px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--page);padding:12px 18px;border-radius:12px;font-weight:500;pointer-events:none;
  transition:opacity .2s,transform .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Storage (IndexedDB, lives on the phone) ---------- */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('my-cookings',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('recipes',{keyPath:'id'});d.createObjectStore('meta');};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{
    const t=db.transaction(store,mode), req=fn(t.objectStore(store)); let out;
    if(req) req.onsuccess=()=>{out=req.result};
    t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error);
  });
}
const allRecipes=()=>tx('recipes','readonly',s=>s.getAll());
const getRecipe=id=>tx('recipes','readonly',s=>s.get(id));
const putRecipe=r=>tx('recipes','readwrite',s=>s.put(r));
const delRecipe=id=>tx('recipes','readwrite',s=>s.delete(id));
const getMeta=k=>tx('meta','readonly',s=>s.get(k));
const setMeta=(k,v)=>tx('meta','readwrite',s=>s.put(v,k));

/* ---------- Starter recipes (added on first launch) ---------- */
const SEED=[
 {id:'seed-shawarma',category:'meat',title:'Oven chicken shawarma',prepTime:'1 h 30 min',servings:'4',sample:true,
  ingredients:['1 kg boneless chicken thighs','3 tbsp olive oil','Juice of 1 lemon','4 garlic cloves, crushed','2 tsp cumin','2 tsp sweet paprika','1 tsp turmeric','½ tsp cinnamon','1 tsp salt','1 red onion, sliced'],
  steps:['Mix the oil, lemon juice, garlic, spices and salt in a bowl.','Coat the chicken well and marinate for at least 1 hour, or overnight in the fridge.','Heat the oven to 220°C.','Spread the chicken and onion on a lined tray in one layer.','Roast 25–30 minutes, until the edges char.','Slice thinly and serve in pita with tahini and chopped salad.'],
  notes:'Leftovers are great cold in a salad the next day.'},
 {id:'seed-stew',category:'meat',title:'Beef stew with root vegetables',prepTime:'3 h',servings:'6',sample:true,
  ingredients:['1.2 kg beef chuck, in 4 cm cubes','2 tbsp flour','3 tbsp oil','2 onions, chopped','3 carrots, in chunks','2 potatoes, in chunks','2 tbsp tomato paste','1 cup red wine','3 cups beef stock','2 bay leaves','Salt and black pepper'],
  steps:['Season the beef with salt and pepper and toss with the flour.','Brown the beef in batches in hot oil in a heavy pot; set aside.','Soften the onions in the same pot, then stir in the tomato paste for 1 minute.','Add the wine and scrape the bottom of the pot.','Return the beef, add stock and bay leaves, cover and simmer 1 h 30 min.','Add carrots and potatoes and simmer 45 minutes more, until tender.','Taste, adjust salt, and serve.'],
  notes:''},
 {id:'seed-majadra',category:'vegan',title:'Majadra (lentils and rice)',prepTime:'1 h',servings:'4',sample:true,
  ingredients:['1 cup green or brown lentils','1 cup basmati rice, rinsed','3 large onions, thinly sliced','½ cup olive oil','1 tsp cumin','½ tsp allspice','1½ tsp salt','Black pepper'],
  steps:['Cook the lentils in plenty of water for 15 minutes; drain.','Fry the onions in the oil over medium heat for 25–30 minutes, until deep brown.','Take out half the onions for topping.','Add rice and spices to the pot and stir for a minute.','Add the lentils and 2 cups boiling water, cover and cook on low for 20 minutes.','Rest 10 minutes off the heat, fluff, and top with the reserved onions.'],
  notes:'Serve with a cucumber and tomato salad.'},
 {id:'seed-lentil-soup',category:'vegan',title:'Red lentil soup',prepTime:'40 min',servings:'4',sample:true,
  ingredients:['1½ cups red lentils, rinsed','1 onion, chopped','2 carrots, chopped','3 garlic cloves','2 tbsp olive oil','1½ tsp cumin','1 tsp turmeric','6 cups water or vegetable stock','Juice of ½ lemon','Salt'],
  steps:['Soften the onion and carrots in the oil for 8 minutes.','Add garlic, cumin and turmeric and stir for 1 minute.','Add lentils and water, bring to a boil, then simmer 20 minutes.','Blend until smooth.','Season with salt and lemon juice.'],
  notes:''}
];

/* ---------- Helpers ---------- */
const app=document.getElementById('app');
const LABEL={meat:'Meat',vegan:'Vegan'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const lines=t=>t.split('\n').map(s=>s.trim()).filter(Boolean);
const count=n=>n===1?'1 recipe':`${n} recipes`;
const setTheme=c=>{document.body.className=c?'theme-'+c:'';document.querySelector('meta[name=theme-color]').content=c==='meat'?'#7A2630':c==='vegan'?'#3E6B3A':'#1F2420';};
const BACK_ICON='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const topbar=(back,title,right='')=>`<header class="top"><a class="back" href="${back}" aria-label="Back">${BACK_ICON}</a><h1>${esc(title)}</h1><div class="top-r">${right}</div></header>`;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600);}
function ago(ts){
  const d=Math.floor((Date.now()-ts)/86400000);
  return d<=0?'today':d===1?'yesterday':`${d} days ago`;
}
function resizeImage(file,max=1200){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'));};
    img.src=url;
  });
}

/* ---------- Home illustrations (inline, so they work offline) ---------- */
const ART={meat:`<svg class="art" viewBox="0 0 240 220" aria-hidden="true">

 <g stroke="#5E1A23" stroke-width="9" stroke-linecap="round" opacity=".55"><path d="M40 92l120 -60M40 130l150 -75M60 165l150 -75M100 185l120 -60"/></g>

<path d="M104 52c8-6 20-6 28 0" stroke="#F7F1EA" stroke-width="12" stroke-linecap="round" fill="none"/>
<g transform="translate(176 150) rotate(-35)">

  <ellipse cx="-7" cy="8" rx="3.4" ry="10" transform="rotate(-35 -7 8)"/><ellipse cx="7" cy="14" rx="3.4" ry="10" transform="rotate(35 7 14)"/>
  <ellipse cx="-7" cy="24" rx="3.4" ry="10" transform="rotate(-35 -7 24)"/><ellipse cx="7" cy="30" rx="3.4" ry="10" transform="rotate(35 7 30)"/>
  <ellipse cx="-7" cy="40" rx="3.4" ry="10" transform="rotate(-35 -7 40)"/><ellipse cx="7" cy="46" rx="3.4" ry="10" transform="rotate(35 7 46)"/>
  <ellipse cx="-6" cy="56" rx="3" ry="9" transform="rotate(-35 -6 56)"/><ellipse cx="6" cy="62" rx="3" ry="9" transform="rotate(35 6 62)"/>
 </g>
</g>
<g fill="#2B0E12"><circle cx="34" cy="176" r="4"/><circle cx="46" cy="186" r="3.2"/><circle cx="28" cy="192" r="3.6"/></g>
<g fill="#F7F1EA"><circle cx="200" cy="40" r="3"/><circle cx="212" cy="52" r="2.2"/><circle cx="192" cy="58" r="2.6"/></g>
</svg>`,vegan:`<svg class="art" viewBox="0 0 240 220" aria-hidden="true">
<g transform="translate(150 20) rotate(28)">
 <path d="M-8 6c-10-14-6-30 2-38M0 4c0-16 6-30 16-38M6 8c10-12 24-16 34-12" stroke="#8DC06A" stroke-width="7" stroke-linecap="round" fill="none"/>

</g>

<path d="M30 70c34 2 70 2 104 2M70 71l-10-16M96 72l-6-18M76 71l-8 14M104 72l-4 14" stroke="#5E8F4C" stroke-width="3" stroke-linecap="round" fill="none"/>
<g transform="translate(92 150) rotate(-18)">

/* ---------- Screens ---------- */
async function viewHome(){
  setTheme(null);
  const all=await allRecipes(), n=c=>all.filter(r=>r.category===c).length;
  const last=await getMeta('lastBackup');
  const own=all.some(r=>!r.sample);
  const stale=own&&(!last||Date.now()-last>14*86400000);
  const foot=last?`Last backup ${ago(last)}${stale?'. Time for a new one.':''}`:(own?'No backup yet. Tap to save one.':'Backup and restore');
  app.innerHTML=`<div class="home">
    <header class="home-head"><h1>My Cookings</h1></header>
    <a class="door door-meat" href="#/list/meat">${ART.meat}<h2>Meat</h2><span>${count(n('meat'))}</span></a>
    <a class="door door-vegan" href="#/list/vegan">${ART.vegan}<h2>Vegan</h2><span>${count(n('vegan'))}</span></a>
    <a class="home-foot ${stale?'warn':''}" href="#/backup">${foot}</a>
  </div>`;
}

async function viewList(cat){
  if(!LABEL[cat]) return go('#/');
  setTheme(cat);
  const items=(await allRecipes()).filter(r=>r.category===cat).sort((a,b)=>a.title.localeCompare(b.title));
  app.innerHTML=`${topbar('#/',LABEL[cat],`<a href="#/new/${cat}">Add recipe</a>`)}
    <div class="wrap">
      ${items.length?`<input class="search" type="search" id="q" placeholder="Search by name or ingredient" aria-label="Search recipes">`:''}
      <ul class="list" id="list"></ul>
    </div>`;
  const list=document.getElementById('list');
  const draw=(q='')=>{
    q=q.trim().toLowerCase();
    const shown=q?items.filter(r=>(r.title+' '+r.ingredients.join(' ')).toLowerCase().includes(q)):items;
    if(!items.length){list.innerHTML=`<li class="empty"><p>No ${LABEL[cat].toLowerCase()} recipes yet.</p><a class="btn btn-primary" href="#/new/${cat}">Add your first recipe</a></li>`;return;}
    if(!shown.length){list.innerHTML=`<li class="empty"><p>Nothing matches “${esc(q)}”.</p></li>`;return;}
    list.innerHTML=shown.map(r=>`<li><a href="#/r/${encodeURIComponent(r.id)}">
      ${r.photo?`<img class="thumb" src="${r.photo}" alt="">`:`<span class="thumb" aria-hidden="true">${esc(r.title.charAt(0).toUpperCase())}</span>`}
      <span><b>${esc(r.title)}</b><small>${[r.prepTime,r.servings&&`serves ${r.servings}`].filter(Boolean).map(esc).join(', ')||'&nbsp;'}</small></span>
    </a></li>`).join('');
  };
  draw();
  const q=document.getElementById('q'); if(q) q.addEventListener('input',()=>draw(q.value));
}

async function viewRecipe(id){
  const r=await getRecipe(id); if(!r) return go('#/');
  setTheme(r.category);
  const meta=[r.prepTime&&`Time: ${esc(r.prepTime)}`,r.servings&&`Serves ${esc(r.servings)}`].filter(Boolean);
  app.innerHTML=`${topbar('#/list/'+r.category,LABEL[r.category],`<a href="#/edit/${encodeURIComponent(r.id)}">Edit</a>`)}
    <article class="recipe">
      ${r.photo?`<img class="hero" src="${r.photo}" alt="">`:''}
      <div class="wrap">
        <h1 class="r-title">${esc(r.title)}</h1>
        ${meta.length?`<p class="meta">${meta.map(m=>`<span>${m}</span>`).join('')}</p>`:''}
        ${r.sample?`<p class="sample">This is a starter example. Edit it into one of yours, or delete it.</p>`:''}
        ${r.ingredients.length?`<h2>Ingredients</h2><ul class="ing">${r.ingredients.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><p class="hint">Tap an ingredient to tick it off while you cook.</p>`:''}
        ${r.steps.length?`<h2>Steps</h2><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:''}
        ${r.notes?`<h2>Notes</h2><p class="notes">${esc(r.notes)}</p>`:''}
        <button class="btn btn-danger" id="del">Delete recipe</button>
      </div>
    </article>`;
  app.querySelectorAll('.ing li').forEach(li=>li.addEventListener('click',()=>li.classList.toggle('done')));
  document.getElementById('del').onclick=async()=>{
    if(!confirm(`Delete “${r.title}”? This can't be undone unless it's in a backup.`)) return;
    await delRecipe(r.id); toast('Recipe deleted'); go('#/list/'+r.category);
  };
}

async function viewEdit(id,cat){
  const existing=id?await getRecipe(id):null;
  if(id&&!existing) return go('#/');
  const r=existing||{category:LABEL[cat]?cat:'meat',title:'',ingredients:[],steps:[],photo:null,prepTime:'',servings:'',notes:''};
  let photo=r.photo;
  setTheme(r.category);
  const cancel=id?'#/r/'+encodeURIComponent(id):'#/list/'+r.category;
  app.innerHTML=`${topbar(cancel,id?'Edit recipe':'New recipe')}
    <form class="wrap form" id="f" novalidate>
      <fieldset class="seg"><legend>Category</legend>
        ${['meat','vegan'].map(c=>`<label><input type="radio" name="category" value="${c}" ${r.category===c?'checked':''}><span>${LABEL[c]}</span></label>`).join('')}
      </fieldset>
      <label class="field"><span>Recipe name</span><input name="title" value="${esc(r.title)}" autocomplete="off"></label>
      <div class="field"><span>Photo</span>
        <div class="photo-box" id="pbox"></div>
        <div class="photo-actions">
          <label class="btn">Choose photo<input type="file" accept="image/*" id="pfile"></label>
          <button type="button" class="btn" id="prm">Remove photo</button>
        </div>
      </div>
      <div class="row">
        <label class="field"><span>Time</span><input name="prepTime" value="${esc(r.prepTime)}" placeholder="45 min"></label>
        <label class="field"><span>Servings</span><input name="servings" value="${esc(r.servings)}" inputmode="numeric" placeholder="4"></label>
      </div>
      <label class="field"><span>Ingredients</span><small>One ingredient per line</small><textarea name="ingredients" rows="8">${esc(r.ingredients.join('\n'))}</textarea></label>
      <label class="field"><span>Steps</span><small>One step per line</small><textarea name="steps" rows="9">${esc(r.steps.join('\n'))}</textarea></label>
      <label class="field"><span>Notes</span><textarea name="notes" rows="3">${esc(r.notes)}</textarea></label>
      <div class="actions"><a class="btn" href="${cancel}">Cancel</a><button class="btn btn-primary" type="submit">Save recipe</button></div>
    </form>`;
  const f=document.getElementById('f'), pbox=document.getElementById('pbox'), prm=document.getElementById('prm');
  const drawPhoto=()=>{pbox.innerHTML=photo?`<img src="${photo}" alt="Recipe photo">`:'';prm.hidden=!photo;};
  drawPhoto();
  f.querySelectorAll('input[name=category]').forEach(i=>i.addEventListener('change',()=>setTheme(i.value)));
  document.getElementById('pfile').addEventListener('change',async e=>{
    const file=e.target.files[0]; if(!file) return;
    try{photo=await resizeImage(file);drawPhoto();}catch{toast('That file couldn’t be opened as a photo.');}
  });
  prm.onclick=()=>{photo=null;drawPhoto();};
  f.onsubmit=async e=>{
    e.preventDefault();
    const d=new FormData(f), title=d.get('title').trim();
    if(!title){toast('Add a recipe name to save.');f.title.focus();return;}
    const now=Date.now();
    const rec={...(existing||{}),id:existing?existing.id:uid(),category:d.get('category'),title,
      ingredients:lines(d.get('ingredients')),steps:lines(d.get('steps')),notes:d.get('notes').trim(),
      prepTime:d.get('prepTime').trim(),servings:d.get('servings').trim(),photo,
      createdAt:existing?.createdAt||now,updatedAt:now};
    delete rec.sample;
    await putRecipe(rec); toast('Recipe saved'); go('#/r/'+encodeURIComponent(rec.id));
  };
}

/* ---------- Backup ---------- */
async function backupFiles(){
  const recipes=await allRecipes();
  const json=JSON.stringify({app:'my-cookings',version:1,exportedAt:new Date().toISOString(),recipes});
  const name=`my-cookings-backup-${new Date().toISOString().slice(0,10)}`;
  return {json,name,count:recipes.length};
}
async function downloadBackup(){
  const {json,name}=await backupFiles();
  const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  const a=Object.assign(document.createElement('a'),{href:url,download:name+'.json'});
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  await setMeta('lastBackup',Date.now()); toast('Backup saved to Downloads'); viewBackup();
}
function shareableFile(json,name){
  if(!navigator.canShare) return null;
  const options=[new File([json],name+'.json',{type:'application/json'}),new File([json],name+'.txt',{type:'text/plain'})];
  return options.find(f=>{try{return navigator.canShare({files:[f]})}catch{return false}})||null;
}
async function shareBackup(){
  const {json,name}=await backupFiles(), file=shareableFile(json,name);
  if(!file) return downloadBackup();
  try{
    await navigator.share({files:[file],title:'My Cookings backup'});
    await setMeta('lastBackup',Date.now()); toast('Backup shared'); viewBackup();
  }catch(e){ if(e.name!=='AbortError') toast('Sharing didn’t work. Use “Download backup file” instead.'); }
}
async function importBackup(file){
  let data;
  try{data=JSON.parse(await file.text());}catch{data=null;}
  if(!data||data.app!=='my-cookings'||!Array.isArray(data.recipes)){toast('That file isn’t a My Cookings backup.');return;}
  let added=0,updated=0;
  for(const r of data.recipes){
    if(!r||!r.id||!r.title||!LABEL[r.category]) continue;
    r.ingredients=Array.isArray(r.ingredients)?r.ingredients:[]; r.steps=Array.isArray(r.steps)?r.steps:[];
    const cur=await getRecipe(r.id);
    if(!cur){await putRecipe(r);added++;}
    else if((r.updatedAt||0)>(cur.updatedAt||0)){await putRecipe(r);updated++;}
  }
  toast(`Restored ${added} new and ${updated} updated recipes`); viewBackup();
}
async function viewBackup(){
  setTheme(null);
  const all=await allRecipes(), last=await getMeta('lastBackup');
  const canShare=!!shareableFile('{}','x');
  app.innerHTML=`${topbar('#/','Backup')}
    <div class="wrap backup">
      <section>
        <h2>Save a backup</h2>
        <p>Creates one file with all ${count(all.length)} and their photos. Keep it in Google Drive or email it to yourself, so your recipes are safe if anything happens to this phone.</p>
        <p class="status">${last?`Last backup: ${new Date(last).toLocaleDateString()} (${ago(last)})`:'No backup saved yet.'}</p>
        <div class="btn-row">
          ${canShare?`<button class="btn btn-primary" id="share">Send backup to Drive or email</button>`:''}
          <button class="btn ${canShare?'':'btn-primary'}" id="dl">Download backup file</button>
        </div>
      </section>
      <section>
        <h2>Restore from a backup</h2>
        <p>Pick a backup file to load its recipes. Recipes already on this phone are kept. If a recipe is in both, the most recently edited version wins.</p>
        <label class="btn">Choose backup file<input type="file" accept=".json,.txt,application/json,text/plain" id="imp"></label>
      </section>
      <section>
        <h2>Using a second phone</h2>
        <ol>
          <li>On this phone, send a backup to Google Drive.</li>
          <li>On the other phone, open the app's web address in Chrome and install it.</li>
          <li>Open Backup there and restore from that file.</li>
        </ol>
        <p>The phones don't sync by themselves. Repeat this whenever you want them to match. Deleting a recipe on one phone doesn't delete it on the other.</p>
      </section>
    </div>`;
  document.getElementById('dl').onclick=downloadBackup;
  const sh=document.getElementById('share'); if(sh) sh.onclick=shareBackup;
  document.getElementById('imp').addEventListener('change',e=>{const f=e.target.files[0]; if(f) importBackup(f); e.target.value='';});
}

/* ---------- Router ---------- */
function go(h){ if(location.hash===h) render(); else location.hash=h; }
async function render(){
  const [,view,arg]=(location.hash.slice(1)||'/').split('/');
  const a=arg&&decodeURIComponent(arg);
  window.scrollTo(0,0);
  if(view==='list') return viewList(a);
  if(view==='r') return viewRecipe(a);
  if(view==='edit') return viewEdit(a);
  if(view==='new') return viewEdit(null,a);
  if(view==='backup') return viewBackup();
  return viewHome();
}

(async()=>{
  try{ db=await openDB(); }
  catch{ app.innerHTML='<div class="wrap"><p style="padding-top:40px">This browser blocked on-phone storage, so recipes can\'t be saved. Open the app in Chrome, not in private mode.</p></div>'; return; }
  if(!(await getMeta('seeded'))){ const now=Date.now(); for(const r of SEED) await putRecipe({...r,photo:null,createdAt:now,updatedAt:0}); await setMeta('seeded',true); }
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();
  window.addEventListener('hashchange',render);
  render();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
